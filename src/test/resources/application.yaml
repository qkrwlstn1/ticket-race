spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        #        format_sql: false
        highlight_sql: true
        #        highlight_sql: false
        use_sql_comments: true
    #        use_sql_comments: false
    show-sql: true
#    show-sql: false

jwt:
  issuer: test-issuer
  secret-key: ZmFrZXNlY3JldGtleWZha2VzZWNyZXRrZXlmYWtlc2VjcmV0a2V5ZmFrZXNlY3JldGtleWZha2VzZWNyZXRrZXk=
  access-minutes: 5
  refresh-days: 7